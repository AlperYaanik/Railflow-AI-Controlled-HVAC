; Railflow demo board firmware. Build and flash with PlatformIO:
;   pio run -d firmware/railflow-board -t upload
;   pio device monitor -d firmware/railflow-board
;
; The platform is pinned to the Arduino-ESP32 2.x core: main.cpp uses the
; ledcSetup/ledcAttachPin PWM API, which core 3.x replaced.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 9600
build_flags = -Wall -Wextra
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
