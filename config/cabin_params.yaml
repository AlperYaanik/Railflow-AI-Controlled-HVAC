# Railway cabin HVAC — physical parameters
#
# Vehicle class: MAINLINE / REGIONAL (EN 13129 scope)
# Operating context: Egyptian National Railways, Cairo - Alexandria corridor.
# Cooling-dominated climate — summer is the design case.
#
# SOURCING RULE
# Every value below carries a [tag] naming where it comes from. This is the
# project's core credibility requirement: no number appears without a source.
#
# WHY each value is what it is -- the sweeps, the rejected alternatives, the
# calibration priority list and a log of what was got wrong and corrected --
# is in docs/PARAMETERS.md. Read that before changing anything here.
#
#   [EN13129]   Stated scope/requirement of EN 13129:2016 (mainline rolling stock)
#   [UIC553]    UIC leaflet 553-1 (climatic chamber test conditions)
#   [GEOMETRY]  Computed from the coach dimensions declared in this file
#   [TYPICAL]   Conventional engineering value for this equipment class
#   [ASSUMPTION] Our own estimate. These are the values to replace first if
#                real vehicle data or the paywalled standard becomes available.
#
# NOTE: EN 13129:2016 and EN 14750:2024 are paywalled and publish no thermal
# time constants. Nothing here asserts one. Both time constants are DERIVED in
# src/config.py:system_time_constants() as the eigenvalues of the two-node
# state matrix, and tests/test_physics.py checks the simulator against them.
# They are occupancy-dependent:
#   empty        tau_fast 1.31 min   tau_slow 97.1 min
#   design load  tau_fast 1.10 min   tau_slow 72.3 min
# (design load recomputed after ventilation.fresh_air_m3_h_per_passenger
# was corrected 15->20; empty is unaffected -- see that value's note, the
# per-passenger rate doesn't apply below min_fresh_air_m3_h's floor)

vehicle:
  class: mainline_regional          # [EN13129] EN 13129 covers main line rolling stock
  description: "Single-deck mainline passenger coach, 2nd class"

geometry:
  length_m: 26.4                    # [TYPICAL] Standard UIC-profile mainline coach
  width_m: 2.9                      # [TYPICAL] UIC loading gauge
  interior_height_m: 2.4            # [TYPICAL] Saloon clear height
  saloon_volume_m3: 150.0           # [GEOMETRY] Gross envelope less vestibules, toilets, ducting
  envelope_area_m2: 290.0           # [GEOMETRY] Sides + roof + floor + end walls
  glazing_area_m2: 22.0             # [GEOMETRY] Side windows, both sides

envelope:
  # Overall heat transfer coefficient of the car body.
  u_value_w_m2k: 2.2                # [ASSUMPTION] Modern insulated rail car body, 2.0-2.5 range
  # UA = envelope_area_m2 * u_value_w_m2k -> computed in code, not hardcoded.

  solar_heat_gain_coefficient: 0.45 # [ASSUMPTION] Tinted/laminated rail glazing.
  # M11: this is now the CEILING (tint_level=0.0, clear/untinted state of the
  # electrochromic glass) -- unchanged in meaning or value from pre-M11, so
  # tint_level=0.0 reproduces every earlier milestone's result exactly.

  solar_heat_gain_coefficient_tinted: 0.15 # [ASSUMPTION] Fully darkened (tint_level=1.0)
  # M11: SPD/electrochromic smart glass. No vehicle-specific product
  # datasheet sourced this figure -- general smart-glass technology supports
  # a substantial transmission swing when fully darkened, but the exact
  # number here is a placeholder, same honesty standard as every other
  # unsourced parameter in this file (see docs/PARAMETERS.md). Swept, not
  # asserted, wherever this matters to a headline claim.

  # glazing_area_m2 counts windows on BOTH sides of the coach, but only one
  # side faces the sun at any moment. Without this factor the solar gain is
  # double-counted. We do not model orientation explicitly (deliberately out
  # of scope), so this is the flat-rate stand-in for it.
  sunlit_glazing_fraction: 0.5      # [ASSUMPTION] One side sunlit; no orientation model

thermal_mass:
  # Effective heat capacity: cabin air plus the interior mass thermally coupled
  # to it on the timescale we care about (seats, panels, floor, luggage racks).
  air_density_kg_m3: 1.2            # [TYPICAL] Dry air near 20 C
  air_cp_j_kgk: 1005.0              # [TYPICAL] Specific heat of air at constant pressure
  latent_heat_vaporization_j_kg: 2.4545e+6 # [TYPICAL] Water, at ~25 C (typical cabin operating
                                     # range). ASHRAE's standard psychrometric reference is
                                     # 2501 kJ/kg at 0 C with a -1.86 kJ/kg per C adjustment:
                                     # 2501 - 1.86*25 = 2454.5 kJ/kg = 2454500 J/kg. Used only
                                     # by CabinModel's simplified moisture balance (M9) to
                                     # convert occupancy.latent_heat_w_per_pax into a moisture
                                     # mass rate -- not a new domain assumption, a unit
                                     # conversion of a number this project already has.
  # Interior mass thermally coupled to the air. Built from a mass budget
  # rather than guessed:
  #   80 seats @ 14 kg    x 1400 J/kgK = 1.57 MJ/K
  #   wall/ceiling panels  900 kg x 1200 = 1.08
  #   floor + subfloor    1200 kg x  900 = 1.08
  #   racks, tables, trim  400 kg x  900 = 0.36
  #   glazing              300 kg x  840 = 0.25
  #                                 total = 4.34 MJ/K if ALL of it coupled
  # Not all of it does on a one-hour timescale (deep subfloor, structure
  # behind panels), so we take ~65% of the budget.
  #
  # Sensitivity: varying this over 1.6-4.34 MJ/K moves tau_slow from 42 to
  # 111 min but changes tau_fast by <3%, the boarding spike by <10%, and
  # pull-down time not at all. Everything the controller sees is governed by
  # C_air and hA, not by this value. See tests/test_physics.py.
  # (Numbers above re-derived during the M8-era cross-milestone audit -- this
  # comment still held pre-fresh-air-correction values, e.g. "45 to 120 min",
  # same staleness independently found and fixed in docs/PARAMETERS.md and
  # ROADMAP.md's M2 section.)
  interior_mass_capacity_j_k: 2.8e+6 # [ASSUMPTION] 65% of a 4.34 MJ/K mass budget
                                     # Signed exponent required: PyYAML reads 2.8e6 as a string
  # C_eff = saloon_volume * air_density * air_cp + interior_mass_capacity

  # Air <-> interior-mass coupling. The model uses TWO nodes, not one lumped
  # node, because lumping them understates the boarding temperature spike by
  # ~2x at the end of a dwell and ~5x in the first two minutes — and that
  # spike is precisely the effect anticipatory control exists to handle.
  interior_surface_area_m2: 250.0    # [ASSUMPTION] Seats, panels, floor, racks
  internal_h_w_m2k: 6.0              # [TYPICAL] Natural convection, indoor surfaces
  # hA_internal = interior_surface_area_m2 * internal_h_w_m2k

ventilation:
  # [TYPICAL, upgraded from ASSUMPTION] EN 13129:2016 Table 11 (via a real
  # climate chamber test report, not the paywalled standard itself): 20
  # m3/h/passenger is the NORMAL/standard rate; 15 and 10 m3/h/pax are
  # explicitly the REDUCED rate for extreme conditions the report doesn't
  # define further. Was 15.0 here -- the reduced figure, not the standard
  # one; corrected once the real source distinguished the two. This raises
  # ventilation_ua() and therefore both derived time constants (tau_fast,
  # tau_slow -- see the header note above and src/config.py); it also
  # displaces an earlier cross-check against a DIFFERENT source's "1200
  # m3/h for an 80-pax, 24 m coach", which matched 15 x 80 exactly and no
  # longer matches 20 x 80 = 1600. That source didn't label which
  # condition it was describing -- flagged as open, not silently resolved,
  # since it may itself have meant the reduced case. See docs/PARAMETERS.md.
  fresh_air_m3_h_per_passenger: 20.0
  min_fresh_air_m3_h: 300.0          # [ASSUMPTION] Floor when the coach is near-empty

occupancy:
  seats: 80                          # [TYPICAL] 2nd class mainline coach
  design_load_pax: 80                # [EN13129] Design load for main line vehicles is all
                                     # seats occupied, including tip-up seats and wheelchairs
  sensible_heat_w_per_pax: 70.0      # [TYPICAL] Seated passenger, light activity
  latent_heat_w_per_pax: 45.0        # [TYPICAL] Seated passenger, light activity

doors:
  # Mainline: infrequent stops, so door infiltration matters less than on metro,
  # but the step at each station is still a real disturbance.
  #
  # Expressed as a RATE while the door is open, not a total per stop. An earlier
  # version stated a per-stop total and divided by the route's mean dwell, which
  # meant editing one station's timetable silently changed the door physics at
  # every other station -- a 12-minute change to Cairo moved door_ua by 36%.
  # Physically the exchange continues for as long as the door is open, so a rate
  # is the correct form and it decouples the physics from the timetable.
  #
  # 28 m3/min against a 150 m3 saloon is ~0.19 air changes per minute, so a
  # 3-minute dwell exchanges roughly half the cabin volume.
  air_exchange_m3_per_min: 28.0      # [ASSUMPTION] Rate while doors are open

hvac:
  # Sized for the Egyptian design condition, NOT a generic European coach.
  # A 30 kW unit (typical in temperate Europe) saturates on 1-6% of summer
  # hours here: the steady-state peak load at T_out 46-48 C with 73 pax and
  # full solar is 33-35 kW. An undersized unit would make the M5 controller
  # comparison meaningless exactly when it matters most, because both
  # controllers would sit pinned at the capacity limit.
  cooling_capacity_w: 40000.0        # [TYPICAL] Rail references quote 12-15 tons of
                                     # refrigeration (42-53 kW) for an 85 ft coach, so
                                     # 40 kW is mid-to-low for this vehicle, not high.
  heating_capacity_w: 25000.0        # [TYPICAL] Rail heater packages (tubular finned
                                     # resistive elements) run 7-36 kW; 25 kW sits on
                                     # the higher side of that range, matched to our
                                     # 40 kW cooling unit. Rarely engages in this
                                     # climate -- see heating_cop below.

  # HEATING COP -- deliberately NOT the cooling curve run backwards.
  #
  # Rail cabin heating is resistive (tubular finned elements), a distinct
  # product from the vapour-compression cooling unit, not a reversible heat
  # pump. Multiple manufacturers sell standalone electric heater packages for
  # this purpose. Resistive heating converts electrical input to heat directly
  # (Joule heating), so COP = 1.0 is a physical identity here, not a fitted
  # curve -- there is no outdoor-temperature dependence to model.
  #
  # This used to reuse cop_nominal/cop_degradation_per_k, which was built for
  # cooling: "COP falls as it gets hotter." Applied to heating that reads
  # backwards -- "COP rises as it gets colder" -- and at 5 C it produced
  # COP 3.8, roughly 4x too cheap for a resistive heater.
  heating_cop: 1.0                   # [TYPICAL] Resistive heating identity, not fitted

  # SUPPLY-AIR PATH -- the constraint that makes the actuator physical.
  #
  # Rated capacity cannot be dumped into the cabin air as sensible power. It is
  # delivered through a finite air stream that cannot be colder than the coil
  # allows, so the achievable cooling depends on how hot the cabin currently is:
  #
  #     Q_cool_max(T_air) = m_dot_supply * c_p * (T_air - T_supply_min)
  #
  # Without this the model permitted 13.3 K/min of air cooling, and a bang-bang
  # thermostat oscillated for a numerical reason rather than a physical one --
  # which would have made any controller comparison a straw man.
  #
  # Rail HVAC supplies 20-30% outside air at design conditions. Fresh air at
  # design load is now 20 m3/h/pax x 80 = 1600 m3/h (see ventilation.
  # fresh_air_m3_h_per_passenger's note on the standard-vs-reduced correction),
  # which at ~25% implies a total supply of ~6400 m3/h.
  #
  # This DISPLACES the previous cross-check here: a different independent
  # source quoted exactly 1200 m3/h for a 24 m, 80-passenger intercity coach
  # at +45 C, which matched the OLD 15 m3/h/pax figure exactly (15 x 80 =
  # 1200) and no longer matches 20 x 80 = 1600. Not silently dropped: that
  # source never labelled which EN 13129 condition (standard or reduced) it
  # was describing, so the mismatch is left open rather than resolved either
  # way. If it turns out that source meant the reduced condition too, both
  # numbers are consistent; if it meant standard, one of the two sources is
  # wrong about this specific vehicle class. Worth another look if time
  # allows, not urgent enough to block on.
  supply_air_m3_h: 6400.0            # [TYPICAL] Fresh air / 0.25 outside-air fraction
  supply_air_min_temp_c: 10.0        # [ASSUMPTION] Coil limit; colder risks frost and
                                     # draught complaints
  supply_air_max_temp_c: 45.0        # [ASSUMPTION] Heating-side equivalent

  # SUPPLY FAN -- runs continuously, and counts twice.
  #
  # Fresh air must be delivered whether or not cooling is called for, so the
  # supply fan is a FLOOR on energy rather than a variable cost. Omitting it
  # inflates any percentage saving, because the denominator is too small.
  #
  # It also counts as a heat load: the motor sits in the air stream, so its
  # electrical power lands in the cabin as sensible heat.
  #
  # Only the SUPPLY fan is modelled here. The condenser fan is conventionally
  # already inside quoted COP/EER figures, so counting it again would double up.
  #
  # EN 13779 / EN 16798-3 put constant-volume systems at 1.7 kW/(m3/s) and
  # variable-volume at 2.4, with regulatory values typically 2-3. Rail ducting
  # is compact and filtered, so mid-range rather than best-in-class.
  supply_fan_sfp_kw_per_m3s: 2.0     # [TYPICAL] EN 13779 / EN 16798-3 range
  cop_nominal: 2.8                   # [TYPICAL] Design-point coefficient of performance
  cop_degradation_per_k: 0.04        # [ASSUMPTION] COP falls as outdoor temperature rises
  cop_reference_t_out_c: 30.0        # [ASSUMPTION] Reference point for the degradation curve
  cop_min: 1.2                       # [ASSUMPTION] Floor, so the model stays physical

  # Actuator lag. This is GENUINELY UNKNOWN and is deliberately NOT claimed.
  # M6 sweeps tau_act over {0, 2, 5, 10, 20} minutes and reports the dependence.
  # The value here is only the default used for single runs.
  dead_time_min: 2.0                 # [ASSUMPTION] Compressor spin-up, damper travel
  tau_act_min: 5.0                   # [ASSUMPTION] SWEPT IN M6 — never presented as fact

  # THERMOSTAT HYSTERESIS (M5's on/off baseline) -- the controller's own
  # switching deadband, NOT comfort.band_k above (that's the metric threshold
  # for scoring discomfort, a different concept entirely).
  #
  # An early draft used an ad-hoc 0.5-1.0 K band, which is unrealistically
  # narrow -- a real compressor would cycle far more often than that. Sourced
  # instead: a vehicle A/C patent documents a real hysteresis of 1.5 K
  # (thresholds 3-4.5 K either side of setpoint); AIRAH (commercial HVAC
  # guidance) recommends 1 K minimum, 2 K as the standard target for systems
  # prioritising energy savings, up to 3 K as a stretch target. 2.0 K is the
  # AIRAH standard target, not the low or high end of either source.
  thermostat_hysteresis_k: 2.0       # [TYPICAL] AIRAH standard target; matches the
                                     # 1.5 K figure found in a real vehicle A/C patent

comfort:
  # EN 13129 defines interior temperature as a sliding function of outdoor
  # temperature rather than a fixed setpoint. This is a simplified version of
  # that concept, not a reproduction of the standard's curve.
  setpoint_c: 22.0                   # [ASSUMPTION] Target at moderate outdoor conditions
  sliding_t_out_low_c: 20.0          # [ASSUMPTION] Below this, setpoint stays at its floor
  sliding_t_out_high_c: 40.0         # [ASSUMPTION] Above this, setpoint stays at its ceiling
  sliding_setpoint_low_c: 22.0       # [ASSUMPTION] Setpoint at the low end
  sliding_setpoint_high_c: 26.0      # [ASSUMPTION] Setpoint at the high end
  band_k: 2.0                        # [ASSUMPTION] Comfort band half-width, +/- K.
                                     # This is the METRIC threshold (how far outside
                                     # counts as discomfort for evaluation), not the
                                     # on/off controller's own switching deadband --
                                     # see hvac.thermostat_hysteresis_k below. The two
                                     # are conceptually different and deliberately not
                                     # tied to the same number.
  target_rh_pct: 55.0                # [TYPICAL] ASHRAE-style indoor comfort target, already
                                     # used as the reference point in docs/PARAMETERS.md's
                                     # humidity-exclusion analysis before any code used it.
                                     # Now also CabinModel.initial_state()'s anchor for the
                                     # cabin's starting humidity ratio (M9) -- the cabin starts
                                     # "in comfort" on humidity, the same way it already starts
                                     # at a chosen t_air_c with no further justification needed.

simulation:
  timestep_min: 1                    # [ASSUMPTION] 1-min integration, aggregated to 5 min later
  control_horizon_min: 30            # [ASSUMPTION] H in the predictive controller

route:
  # Cairo - Alexandria, the flagship Egyptian National Railways intercity line
  # (~208 km). Station list and stopping pattern are real; timings and passenger
  # numbers are representative, not operator data.
  name: "Cairo - Alexandria intercity"
  stations:                          # [ASSUMPTION] Timings/loads; station list is real
    - {name: "Cairo Ramses",   arrive_min: 0,   dwell_min: 8, boarding: 68, alighting: 0}
    - {name: "Benha",          arrive_min: 45,  dwell_min: 3, boarding: 14, alighting: 9}
    - {name: "Tanta",          arrive_min: 80,  dwell_min: 4, boarding: 22, alighting: 24}
    - {name: "Damanhour",      arrive_min: 120, dwell_min: 3, boarding: 11, alighting: 18}
    - {name: "Sidi Gaber",     arrive_min: 155, dwell_min: 3, boarding: 4,  alighting: 35}
    - {name: "Alexandria Misr", arrive_min: 165, dwell_min: 0, boarding: 0, alighting: 33}

  # Real ENR services vary in stopping pattern. Train 2027 (Talgo) calls only at
  # Cairo, Sidi Gaber and Alexandria and takes about 2 h 30, against ~2 h 45 for
  # the semi-express above. Modelled by skipping the intermediate calls and
  # recovering their dwell time, which lands at ~2 h 35 -- close to the real
  # figure without inventing a separate timetable.
  express_calls:                     # [TYPICAL] Real Talgo 2027 stopping pattern
    - "Cairo Ramses"
    - "Sidi Gaber"
    - "Alexandria Misr"

  # M11: illustrative sun-blocking zones for the window-tint controller demo.
  # [ASSUMPTION / DEMO DEVICE] -- NOT a claim that the real Cairo-Alexandria
  # line has tunnels; the Nile Delta this route crosses is flat, low-lying
  # terrain, and no tunnel was sourced for it. Stands in for whatever a real
  # deployment's route would actually have (a tunnel, a station canopy, a
  # shaded/elevated section, a built-up urban stretch) -- anywhere GHI
  # reaching the cabin drops sharply and predictably by route position, which
  # is the thing the anticipatory tint controller is meant to react to before
  # it happens, not while it's already underway. Two zones by minute-into-
  # journey, chosen to land clear of station dwells so the effect is
  # separable from boarding/alighting disturbances.
  tunnel_zones_min:
    - {start_min: 60,  end_min: 65}
    - {start_min: 135, end_min: 142}

locations:
  # Real historical weather, fetched by src/weather.py from the Open-Meteo
  # Archive API. Egypt is a cooling-dominated climate: the design case is
  # summer, and heating is close to irrelevant year-round.
  #
  # Cairo is the network hub and the realistic operating point. Aswan is the
  # thermal stress case, approaching the +45 C upper bound of the UIC 553-1
  # climatic chamber test envelope. [UIC553]
  - name: cairo
    latitude: 30.0444
    longitude: 31.2357
    seasons:
      summer: {start: "2024-06-01", end: "2024-08-31"}
      winter: {start: "2024-01-01", end: "2024-02-29"}
  - name: aswan
    latitude: 24.0889
    longitude: 32.8998
    seasons:
      summer: {start: "2024-06-01", end: "2024-08-31"}
      winter: {start: "2024-01-01", end: "2024-02-29"}
